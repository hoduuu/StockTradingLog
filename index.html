<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미국주식 매매장부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand">매매장부</h1>
    <div class="seg" id="accountSeg" role="tablist" aria-label="계좌 선택">
      <button data-acc="ALL" class="on">전체</button>
      <button data-acc="MAIN">주계좌</button>
      <button data-acc="DIV">부계좌</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="home" class="on">홈</button>
    <button data-tab="tickers">종목별</button>
    <button data-tab="holdings">보유</button>
    <button data-tab="trades">매매내역</button>
    <button data-tab="cash">입출금</button>
    <button data-tab="diary">일기</button>
    <button data-tab="data">데이터</button>
  </nav>
</header>

<div class="quick">
  <button class="btn buy" data-new="BUY">+ 매수</button>
  <button class="btn sell" data-new="SELL">+ 매도</button>
  <button class="btn" data-new="CASH">+ 입출금</button>
  <button class="btn" data-new="NOTE">+ 일기</button>
</div>

<main id="view"></main>

<dialog id="modal">
  <form id="modalForm" method="dialog"></form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
